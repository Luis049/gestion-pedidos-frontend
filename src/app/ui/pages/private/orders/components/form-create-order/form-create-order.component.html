<div class="">
  <form [formGroup]="formOrder">
    <div class="flex flex-col gap-4">
      <sd-input placeholder="Descripción" formName="description"></sd-input>
      <sd-select
        placeholder="Tipo de pedido"
        formName="storeId"
        [items]="storesList()"
        [itemSelected]="storeSelected"
        (itemSelectedChange)="changeStore($event)"
      ></sd-select>
      <sd-file-upload (fileUploaded)="onImagePicked($event)"></sd-file-upload>
    </div>
  </form>
  <div class="mt-4 flex justify-center items-center">
    <sd-button
      text="Cancelar"
      color="white"
      (click)="orderCancel.emit()"
    ></sd-button>
    <sd-button
      [disabled]="formOrder.invalid"
      text="Crear pedido"
      color="primary"
      (click)="onSubmit()"
    ></sd-button>
  </div>
</div>
