<div class="">
  <form [formGroup]="formOrder">
    <div class="flex flex-col gap-4">
      <sd-input
        dataTestId="input-description-order"
        placeholder="Descripción"
        formName="description"
      ></sd-input>
      <sd-select
        dataTestId="input-store-order"
        placeholder="Tipo de pedido"
        formName="storeId"
        [items]="storesList()"
        [itemSelected]="storeSelected"
        (itemSelectedChange)="changeStore($event)"
      ></sd-select>
      <sd-file-upload
        dataTestId="input-file-order"
        (fileSelected)="onImagePicked($event)"
      ></sd-file-upload>
    </div>
  </form>
  <div class="mt-4 flex items-center justify-center">
    <sd-button
    dataTestId="btn-cancel-order"
      text="Cancelar"
      color="white"
      (click)="orderCancel.emit()"
    ></sd-button>
    <sd-button
      dataTestId="btn-create-order"
      [disabled]="formOrder.invalid"
      text="Crear pedido"
      color="primary"
      (click)="onSubmit()"
    ></sd-button>
  </div>
</div>
