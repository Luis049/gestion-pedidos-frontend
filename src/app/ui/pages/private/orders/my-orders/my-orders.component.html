<div class="pt-10 mx-14">
  <h1 class="text-2xl font-bold">Mis pedidos</h1>
  <div class="flex justify-end">
    <sd-button
      data-test-id="btn-add-my-order"
      text="Crear pedido"
      color="primary"
      size="md"
      (click)="dialogCreateOrder.openDialog()"
    ></sd-button>
  </div>
  <div class="container-filters">
    <sd-select
      (itemSelectedChange)="storeSelected = $event"
      [itemSelected]="storeSelected"
      [items]="stores()"
    ></sd-select>
    <sd-search-field placeholder="Buscar pedidos..." />
    <sd-select
      itemSelected=""
      idUnique="my-orders"
      [items]="status"
    ></sd-select>
    <div class="flex items-center gap-4">
      <sd-checkbox id="check-arrived" label="Archivados" />
      <label for="check-arrived"> Archivados </label>
    </div>
  </div>

  <div class="mt-4 justify-center gap-10 grid grid-cols-1 sm:grid-cols-1 md:grid-cols-1 lg:grid-cols-2 xl:grid-cols-2 2xl:grid-cols-3">
    @for (order of orders(); track order.ref) {
    <order-card
    (orderCancel)="cancelOrder(order.id)"
    (orderDetail)="showDetail(order.id)"
    [order]="order" />
    }
  </div>
</div>

<sd-dialog title="Crear pedido" #dialogCreateOrder>
  <app-form-create-order
    (orderCreated)="dialogCreateOrder.closeDialog(); getStores()"
    (orderCancel)="dialogCreateOrder.closeDialog()"
  ></app-form-create-order>
</sd-dialog>


<app-order-detail
  #dialogOrderDetail
/>
